name: Auto post
on:
 schedule: [{cron: '0 21 * * *'}]
 workflow_dispatch:
jobs:
 post:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: oven-sh/setup-bun@v2
     with: {bun-version: '1.3.14'}
   - run: bun install
   - run: bun run autoPost
     env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
   - run: git config user.name 'CozyMoney Bot' && git config user.email 'actions@users.noreply.github.com' && git add src/data/posts && git diff --cached --quiet || (git commit -m 'chore: automated posts' && git push)
